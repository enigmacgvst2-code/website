name: ESO Data Auto-Sync

on:
  schedule:
    - cron: '37 7 * * *' # Daily at 07:37 UTC = 09:37 in Italy in summer (CEST), 08:37 in winter (CET). Off the hour: GitHub delays on-the-hour runs most
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-eso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install matplotlib pandas numpy

      - name: Fetch ESO Data & Generate Plot
        run: python update_eso.py

      - name: Commit and Publish Updated Data & Plot
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json images/P3_P4_timeline*.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ESO observation data and timeline image" && git push)
